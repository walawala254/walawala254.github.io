name: Redesign CI

on:
  push:
    branches:
      - redesign/risk-intelligence-v3
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Release validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build all static routes
        run: npm run build

      - name: Validate JavaScript syntax
        run: find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Validate built HTML with W3C Nu
        run: npm run test:html

      - name: Check branch whitespace
        run: git diff --check "$(git merge-base origin/main HEAD)"..HEAD

      - name: Run browser release gates
        env:
          BROWSER_PATH: google-chrome
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/portfolio-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/portfolio-preview.log
              exit 1
            fi
            sleep 1
          done
          npm run test:a11y
          npm run test:browser
          npm run test:prototypes
