# APPROVED PRODUCTION WORKFLOW
# Activated after explicit owner deployment approval and Vercel Git containment.
# Push deployment is restricted to reviewed changes reaching main.

name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Build validated Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out approved main revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Build release or stage approved legacy rollback
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] && [ -f package.json ]; then
            npm ci
            npm audit --audit-level=moderate
            npm run build
            npm run test:html
          else
            required=(index.html about.html services.html portfolio.html contact.html style.css script.js)
            for file in "${required[@]}"; do
              test -f "$file" || { echo "Missing legacy rollback file: $file"; exit 1; }
            done
            mkdir -p dist
            cp "${required[@]}" dist/
            test ! -f 404.html || cp 404.html dist/
            if [ -d public ]; then
              cp -a public/. dist/
            fi
            find . -maxdepth 1 -type f \
              \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.svg' \) \
              -exec cp '{}' dist/ \;
          fi
          test -f dist/index.html
          test -f dist/about.html
          test -f dist/services.html
          test -f dist/portfolio.html
          test -f dist/contact.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy approved Pages artifact
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
